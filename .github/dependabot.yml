version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: preview
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: preview
    labels:
      - dependencies
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
