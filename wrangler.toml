name = "wireloop"
compatibility_date = "2026-07-04"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# ── R2 bucket binding ─────────────────────────────────────────────
# Base binding — applies to all environments.
# Preview uses the same bucket; production overrides below.
[[r2_buckets]]
binding = "R2"
bucket_name = "wireloop-bucket"
